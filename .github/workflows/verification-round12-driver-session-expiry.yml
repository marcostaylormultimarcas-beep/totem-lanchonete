name: Verification Round 12 Driver Session Expiry
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verification-round-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded transform
        run: python scripts/fix-entregador-expired-session.py
      - name: Security assertions
        run: |
          grep -q "const expireSession = useCallback" src/pages/EntregadorDashboard.tsx
          grep -q "if (isInvalidSession(data)) expireSession" src/pages/EntregadorDashboard.tsx
          grep -q "if (isInvalidSession(res)) expireSession" src/pages/EntregadorDashboard.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --package-lock=false
      - run: npm test -- --run
      - run: npm run build
      - name: Commit validated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/EntregadorDashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "security: centralize expired driver session handling"
          git push origin HEAD:fix/verification-round-2
