name: Verification Round 9 Senhas
on:
  push:
    branches: [fix/verification-round-2]
    paths: ['.github/workflows/verification-round9-senhas.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verification-round-2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded senhas fallback fix
        run: python scripts/fix-senhas-realtime-fallback.py
      - name: Install
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit only after validation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PainelSenhas.tsx
          git commit -m 'fix: keep password display synced when realtime drops'
          git push origin HEAD:fix/verification-round-2
