name: Admin chunk hardening audit

# Lazy-loading migration is already applied. Keep this workflow read-only so a
# historical migration script cannot rewrite the validated Admin implementation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Admin lazy-loading remains present
        shell: bash
        run: |
          grep -q "lazy(" src/pages/Admin.tsx
          grep -q "Suspense" src/pages/Admin.tsx
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
