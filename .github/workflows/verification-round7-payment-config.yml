name: Verification Round 7 Payment Config

on:
  push:
    branches:
      - fix/verification-round-2
    paths:
      - '.github/workflows/verification-round7-payment-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verification-round-2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded payment configuration fix
        run: python scripts/fix-payment-mp-secret-detection.py
      - name: Install
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit only after validation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/kiosk/PaymentScreen.tsx
          git commit -m 'fix: detect Mercado Pago through Vault configuration'
          git push origin HEAD:fix/verification-round-2
