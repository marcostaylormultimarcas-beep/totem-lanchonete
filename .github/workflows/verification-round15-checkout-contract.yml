name: Verification Round 15 Checkout Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Checkout contract assertions
        run: |
          grep -q "rpc('next_order_number'" src/components/kiosk/PaymentScreen.tsx
          ! grep -q "count: 'exact', head: true" src/components/kiosk/PaymentScreen.tsx
          grep -q 'add column if not exists scheduled_for timestamptz' supabase/migrations/20260916234500_visionfood_v2_order_checkout_contract_phase40.sql
          grep -q 'orders_org_order_number_uidx' supabase/migrations/20260916234500_visionfood_v2_order_checkout_contract_phase40.sql
          grep -q 'security definer' supabase/migrations/20260916234500_visionfood_v2_order_checkout_contract_phase40.sql
          grep -q 'revoke all on function public.next_order_number(uuid) from public' supabase/migrations/20260916234500_visionfood_v2_order_checkout_contract_phase40.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --package-lock=false
      - run: npm test -- --run
      - run: npm run build
