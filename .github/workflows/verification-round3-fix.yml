name: Verification Round 3 Fix
on:
  push:
    branches: [fix/verification-round-2]
    paths: [.github/workflows/verification-round3-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verification-round-2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded final fixes
        run: python scripts/fix-verification-round3.py
      - name: Install
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Test and build
        run: |
          npm test -- --run
          npm run build
      - name: Commit only after validation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/kiosk/PaymentScreen.tsx src/components/admin/VisionPrimePanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: recover payment errors and numeric inputs"
          git push origin HEAD:fix/verification-round-2
