name: Verification Round 24 - Authoritative Checkout
on:
  pull_request:
    branches: [visionfood-v2-commercial-ready]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Existing dependency tree has React 18 + react-leaflet 5 peer conflict; use the project's established validation install path.
      - run: npm install --legacy-peer-deps --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Assert authoritative checkout cutover
        run: |
          grep -q "quote_order_checkout_v2" src/components/kiosk/PaymentScreen.tsx
          grep -q "create_order_checkout_v3" src/components/kiosk/PaymentScreen.tsx
          ! grep -q "create_order_checkout_v2" src/components/kiosk/PaymentScreen.tsx
          grep -q "_delivery_context" src/components/kiosk/PaymentScreen.tsx
          grep -q "_coupon_code" src/components/kiosk/PaymentScreen.tsx
          grep -q "serverQuote" src/components/kiosk/PaymentScreen.tsx
          ! grep -q "rpc('quote_order_checkout' as any" src/components/kiosk/PaymentScreen.tsx
          ! grep -q "rpc('create_order_checkout' as any" src/components/kiosk/PaymentScreen.tsx
          grep -q "delivery_mode='lista_ceps'" supabase/migrations/20260918039000_visionfood_v2_delivery_context_rpc_names_phase92.sql
