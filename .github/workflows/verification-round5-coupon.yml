name: Verification Round 5 Coupon

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
