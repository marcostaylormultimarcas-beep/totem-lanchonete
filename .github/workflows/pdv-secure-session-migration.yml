name: PDV secure session audit

# Historical migration already applied. This workflow is intentionally read-only
# so it cannot rewrite the current validated PDV implementation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify secure PDV session contract exists
        shell: bash
        run: |
          grep -q "pdv_create_session" src/lib/pdvSession.ts
          grep -q "pdv_session_context" src/lib/pdvSession.ts
          grep -q "pdv_revoke_session" src/lib/pdvSession.ts
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
