name: Verification Round 21 - Routing Ready Delivery
on:
  workflow_dispatch:
  push:
    branches: [fix/verification-round-2]
    paths: ['.github/workflows/verification-round21-routing-ready.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/verification-round-2, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python scripts/fix-routing-ready-delivery-contract.py
      - name: Assert routing contract
        run: |
          grep -q ".eq('status', 'ready')" src/components/admin/RoteirizacaoIAPanel.tsx
          grep -q ".in('order_type', \['delivery', 'viagem'\])" src/components/admin/RoteirizacaoIAPanel.tsx
          grep -q ".eq('organization_id', organizationId)" src/components/admin/RoteirizacaoIAPanel.tsx
          grep -q "updatedOrders || \[\]" src/components/admin/RoteirizacaoIAPanel.tsx
          grep -q "Nenhum pedido pronto aguardando rota" src/components/admin/RoteirizacaoIAPanel.tsx
      - run: npm install --legacy-peer-deps --package-lock=false
      - run: npm test -- --run
      - run: npm run build
      - name: Commit validated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/RoteirizacaoIAPanel.tsx
          git commit -m "fix: route only ready delivery orders safely"
          git push origin HEAD:fix/verification-round-2
