name: PDV PIX status polling

on:
  workflow_dispatch:
  push:
    branches: [visionfood-v2-commercial-ready]
    paths:
      - scripts/migrate-pdv-pix-status-polling.py
      - .github/workflows/pdv-pix-status-polling.yml

permissions:
  contents: write

jobs:
  migrate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visionfood-v2-commercial-ready
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded migration
        run: python3 scripts/migrate-pdv-pix-status-polling.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false
      - name: Build
        run: npm run build
      - name: Commit validated PDV change
        run: |
          if git diff --quiet -- src/pages/PDV.tsx; then
            echo 'No PDV change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PDV.tsx
          git commit -m 'feat: poll PIX payment status in PDV'
          git pull --rebase origin visionfood-v2-commercial-ready
          git push origin HEAD:visionfood-v2-commercial-ready
